# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Daily Sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: daily-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single job so sync output (new blog HTML, blogs.json, sitemap) stays on disk for backfill + deploy.
  daily-sync:
    name: Sync, enrich, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NODE_OPTIONS: --no-deprecation
      # Optional repository variables (Settings → Secrets and variables → Actions → Variables).
      SITE_BASE_URL: "${{ vars.SITE_BASE_URL }}"
      BLOG_BASE_PATH: "${{ vars.BLOG_BASE_PATH }}"
      STRAPI_COLLECTION: "${{ vars.STRAPI_COLLECTION }}"
      SITE_DOMAIN: "${{ vars.SITE_DOMAIN }}"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Strapi secrets
        env:
          STRAPI_API_URL: ${{ secrets.STRAPI_API_URL }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
        run: |
          if [ -z "${STRAPI_API_URL:-}" ] || [ -z "${STRAPI_API_TOKEN:-}" ]; then
            echo '::error::Configure Actions secrets STRAPI_API_URL and STRAPI_API_TOKEN (Settings → Secrets and variables → Actions).'
            exit 1
          fi

      - name: Sync content from Strapi
        env:
          STRAPI_API_URL: ${{ secrets.STRAPI_API_URL }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
        run: npm run sync

      - name: Backfill internal links in blog articles
        run: npm run backfill

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo '::error::Configure Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions).'
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
